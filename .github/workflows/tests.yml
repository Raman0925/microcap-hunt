name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pytest-cov requests beautifulsoup4 fastapi uvicorn
      - run: cd microcap && python -m pytest tests/ -v --tb=short
